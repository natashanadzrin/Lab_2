<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 2 - Conference Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #fdfdfd;
            color: #222;
        }
        h1 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        form {
            max-width: 500px;
            background: #fff;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #aaa;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="number"] {
            width: 80px;
        }
        .radio-group, .checkbox-group {
            margin-top: 5px;
        }
        .radio-group label, .checkbox-group label {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
            margin-top: 5px;
        }
        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }
        textarea {
            height: 100px;
            resize: vertical;
        }
        .btn-container {
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            border: 1px solid #888;
            background-color: #eef;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
        }
        button:hover {
            background-color: #dde;
        }
    </style>
</head>
<body>

    <h1>Conference Registration Form</h1>

    <form action="#" method="POST">
        
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="99" value="18" required>

        <label>Gender:</label>
        <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>

        <label for="country">Country of Residence:</label>
        <select id="country" name="country">
            <option value="Malaysia" selected>Malaysia</option>
            <option value="Singapore">Singapore</option>
            <option value="Indonesia">Indonesia</option>
            <option value="Brunei">Brunei</option>
            <option value="Thailand">Thailand</option>
            <option value="Other">Other</option>
        </select>

        <label>Areas of Interest:</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="interest" value="Software Development"> Software Development</label><br>
            <label><input type="checkbox" name="interest" value="Data Science"> Data Science</label><br>
            <label><input type="checkbox" name="interest" value="Cybersecurity"> Cybersecurity</label><br>
            <label><input type="checkbox" name="interest" value="Artificial Intelligence"> Artificial Intelligence</label>
        </div>

        <label>Experience Level:</label>
        <div class="radio-group">
            <label><input type="radio" name="experience" value="Beginner"> Beginner</label><br>
            <label><input type="radio" name="experience" value="Intermediate"> Intermediate</label><br>
            <label><input type="radio" name="experience" value="Advanced"> Advanced</label>
        </div>

        <label for="comments">Comments or Questions:</label>
        <textarea id="comments" name="comments" placeholder="Any comments or questions?"></textarea>

        <div class="btn-container">
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</body>
</html>
